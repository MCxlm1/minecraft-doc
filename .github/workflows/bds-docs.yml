name: 构建 bds-docs 元数据下载

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-bds-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno (>=2.4)
        uses: denoland/setup-deno@v1
        with:
          deno-version: ">=2.4"

      - name: 读取 bds-config 分支
        id: bdscfg
        run: |
          BRANCH=$(node -e "console.log((require('./bds-config.json').branch||'preview').trim())")
          echo "BRANCH_TO_UPDATE=$BRANCH" >> $GITHUB_ENV
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: 运行 bds-docs 生成器（下载 BDS → 提取元数据 + 类型）
        env:
          BRANCH_TO_UPDATE: ${{ env.BRANCH_TO_UPDATE }}
          BDS_NO_PUSH: "1"
          GITHUB_ACTIONS: ""
        run: |
          unset GITHUB_ACTIONS 2>/dev/null || true
          cd vendor/bds-docs
          deno run --allow-all dist/main.js
          echo "完成，目录内容："
          ls -la | head -20
          echo "查找 __installation__ 目录内容："
          if [ -d "__installation__" ]; then
            ls -la __installation__/ | head -20
          fi

      - name: 收集生成产物（metadata 和 behavior_packs）
        id: collect
        run: |
          cd vendor/bds-docs
          mkdir -p ../../bds-output
          # 复制 metadata（由生成器产生）
          if [ -d "metadata" ]; then
            cp -r metadata ../../bds-output/
            echo "metadata 已复制"
          else
            echo "metadata 目录不存在"
          fi
          # 查找 behavior_packs 目录（BDS 自带的）
          BEHAVIOR_DIR=$(find . -type d -name "behavior_packs" -print -quit 2>/dev/null || true)
          if [ -n "$BEHAVIOR_DIR" ]; then
            cp -r "$BEHAVIOR_DIR" ../../bds-output/
            echo "behavior_packs 已从 $BEHAVIOR_DIR 复制"
          else
            echo "behavior_packs 未找到"
          fi
          # 列出最终产物
          echo "bds-output 目录内容："
          ls -la ../../bds-output/ || echo "bds-output 目录为空或不存在"

      - name: 删除冲突的 protocol 子目录（解决重复 $id）
        id: remove_protocol
        run: |
          PROTOCOL_DIR="bds-output/metadata/json_schemas/protocol"
          if [ -d "$PROTOCOL_DIR" ]; then
            echo "删除 $PROTOCOL_DIR 以解决重复 $id 冲突"
            rm -rf "$PROTOCOL_DIR"
            echo "已删除 protocol 目录"
          else
            echo "protocol 目录不存在，跳过"
          fi

      - name: 处理 behavior_packs（使用 brarchive-extractor）
        id: process_brax
        run: |
          set -e
          # 检查 behavior_packs 是否存在且非空
          if [ ! -d "bds-output/behavior_packs" ] || [ -z "$(ls -A bds-output/behavior_packs)" ]; then
            echo "behavior_packs 不存在或为空，创建占位 zip"
            cd bds-output
            echo "No behavior_packs data available." > README_empty.txt
            zip processed-behavior_packs.zip README_empty.txt
            rm README_empty.txt
            cd ..
            echo "should_process=true" >> $GITHUB_ENV
            exit 0
          fi
          echo "should_process=true" >> $GITHUB_ENV
          
          # 克隆 brarchive-extractor
          git clone https://github.com/LPaicen/brarchive-extractor.git brarchive-extractor
          
          # 构建 brax
          cd brarchive-extractor
          npm install
          npm run build
          cd ..
          
          # 处理 behavior_packs
          mkdir -p bds-output/processed-behavior_packs
          node brarchive-extractor/dist/src/cli.js bds-output/behavior_packs --schema bds-output/metadata/json_schemas/ --output bds-output/processed-behavior_packs --overwrite --verbose
          
          # 打包处理结果
          cd bds-output
          zip -r processed-behavior_packs.zip processed-behavior_packs
          cd ..
          echo "processed-behavior_packs.zip 已生成"

      - name: 打包产物到 _release 目录
        run: |
          mkdir -p _release
          # 打包 metadata（如果存在）
          if [ -d "vendor/bds-docs/metadata" ]; then
            cd vendor/bds-docs
            zip -r ../../_release/metadata-${{ env.BRANCH_TO_UPDATE }}.zip metadata
            cd ../..
          else
            echo "metadata 不存在，跳过打包"
          fi
          # 复制 processed-behavior_packs.zip（如果存在）
          if [ -f "bds-output/processed-behavior_packs.zip" ]; then
            cp bds-output/processed-behavior_packs.zip _release/processed-behavior_packs-${{ env.BRANCH_TO_UPDATE }}.zip
            echo "processed-behavior_packs.zip 已复制到 _release"
          else
            echo "processed-behavior_packs.zip 不存在，跳过"
          fi
          ls -la _release/

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bds-assets-${{ env.BRANCH_TO_UPDATE }}"
          # 检查 Release 是否存在
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新 asset"
            gh release upload "$TAG" _release/* --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" _release/* --title "BDS assets (${{ env.BRANCH_TO_UPDATE }})" --generate-notes --latest=false
          fi
          echo "下载地址: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
