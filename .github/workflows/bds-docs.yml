name: 构建 bds-docs 元数据下载

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-bds-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno (>=2.4)
        uses: denoland/setup-deno@v1
        with:
          deno-version: ">=2.4"

      - name: 读取 bds-config 分支
        id: bdscfg
        run: |
          BRANCH=$(node -e "console.log((require('./bds-config.json').branch||'preview').trim())")
          echo "BRANCH_TO_UPDATE=$BRANCH" >> $GITHUB_ENV
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: 运行 bds-docs 生成器（下载 BDS → 提取元数据 + 类型）
        env:
          BRANCH_TO_UPDATE: ${{ env.BRANCH_TO_UPDATE }}
          BDS_NO_PUSH: "1"            # 集成到本仓库：只生成，不 git push
          GITHUB_ACTIONS: ""          # 置空：让生成器内部的 git 登录/提交(if(!GIT_IS_GITHUB_ACTION))全部跳过
        run: |
          unset GITHUB_ACTIONS 2>/dev/null || true
          cd vendor/bds-docs
          deno run --allow-all dist/main.js
          echo "完成，目录内容："
          ls -la | head -20

      - name: 收集生成产物（metadata 和 behavior_packs）
        id: collect
        run: |
          cd vendor/bds-docs
          mkdir -p ../../bds-output
          # 复制 metadata 如果存在
          if [ -d "metadata" ]; then
            cp -r metadata ../../bds-output/
            echo "metadata 已复制"
          else
            echo "metadata 目录不存在"
          fi
          # 复制 behavior_packs 如果存在
          if [ -d "behavior_packs" ]; then
            cp -r behavior_packs ../../bds-output/
            echo "behavior_packs 已复制"
          else
            echo "behavior_packs 目录不存在"
          fi
          # 列出最终产物
          echo "bds-output 目录内容："
          ls -la ../../bds-output/ || echo "bds-output 目录为空或不存在"

      - name: 打包 metadata 为 zip（保持原有 Release 兼容性）
        run: |
          cd vendor/bds-docs
          if [ -d "metadata" ]; then
            mkdir -p ../../_release
            zip -r ../../_release/metadata-${{ env.BRANCH_TO_UPDATE }}.zip metadata
            ls -la ../../_release/
          else
            echo "metadata 不存在，跳过打包"
          fi

      - name: 发布到 GitHub Release（固定 tag bds-metadata-<branch>）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bds-metadata-${{ env.BRANCH_TO_UPDATE }}"
          ASSET="_release/metadata-${{ env.BRANCH_TO_UPDATE }}.zip"
          if [ -f "$ASSET" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，更新 asset"
              gh release upload "$TAG" "$ASSET" --clobber
            else
              echo "创建 Release $TAG"
              gh release create "$TAG" "$ASSET" --title "bds metadata ${{ env.BRANCH_TO_UPDATE }}" --generate-notes --latest=false
            fi
          else
            echo "没有可发布的 asset，跳过"
          fi

      - name: 推送 bds-output 到独立分支（供 docs workflow 使用）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 检查 bds-output 目录是否存在且非空
          if [ ! -d "bds-output" ] || [ -z "$(ls -A bds-output)" ]; then
            echo "bds-output 目录为空或不存在，跳过分支推送"
            exit 0
          fi
          
          # 配置 git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH="bds-output-${{ env.BRANCH_TO_UPDATE }}"
          
          # 检查远程分支是否存在
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "分支 $BRANCH 已存在，切换到该分支"
            git fetch origin "$BRANCH"
            git switch "$BRANCH"
          else
            echo "创建新分支 $BRANCH"
            git switch --orphan "$BRANCH"
          fi
          
          # 清空工作目录（保留 .git）
          echo "清空工作目录..."
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} \; 2>/dev/null || true
          
          # 复制 bds-output 内容到根目录
          echo "复制 bds-output 内容..."
          cp -r bds-output/* . 2>/dev/null || echo "bds-output 为空，跳过复制"
          rm -rf bds-output
          
          # 添加并提交
          echo "提交更改..."
          git add .
          git commit -m "Update BDS output for ${{ env.BRANCH_TO_UPDATE }} branch" --allow-empty
          echo "推送到远程分支..."
          git push --force origin "$BRANCH"
