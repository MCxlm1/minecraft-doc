name: 构建文档站 (typedoc 原生 + MoLang + Legacy)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: '构建模式'
        required: true
        default: 'rebuild'
        options:
          - 'rebuild'               # 仅重新构建网页（用已下载的包 + 现有翻译）
          - 'rebuild-and-update'    # 按 minecraft-versions.json 重新 npm 下载对应版本 + 重建网页

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目依赖 (pnpm 9，typedoc + ts-morph)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --no-frozen-lockfile

      - name: 重新下载 npm 对应版本 (rebuild-and-update)
        if: ${{ github.event.inputs.mode == 'rebuild-and-update' }}
        run: node scripts/npm-update.mjs

      - name: 确保 @minecraft 包存在 (rebuild 兜底)
        if: ${{ github.event.inputs.mode != 'rebuild-and-update' }}
        run: |
          if [ ! -f registry/preview/rc/node_modules/@minecraft/server/index.d.ts ]; then
            echo "未找到已下载的包，执行 npm-update…"
            node scripts/npm-update.mjs
          fi

      - name: 生成 changelog 快照与 diff
        run: node scripts/changelog-generate.mjs

      - name: 生成文档 (typedoc 原生 + 翻译片段 hook，包含主页)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scripts/generate.mjs

      - name: 生成 Legacy 旧版本脚本文档
        run: node scripts/legacy-gen.mjs

      - name: 生成 Molang 文档
        run: node scripts/molang-gen.mjs

      # ---------- 集成 brarchive-extractor 处理 behavior_packs（带缓存） ----------
      - name: 拉取 bds-output-preview 分支并检查更新
        id: fetch_bds
        run: |
          # 克隆 bds-output-preview 分支到临时目录
          git clone --branch bds-output-preview --depth 1 https://github.com/MCxlm1/minecraft-doc.git bds-output-temp
          mv bds-output-temp bds-output
          # 获取当前 commit SHA
          CURRENT_COMMIT=$(cd bds-output && git rev-parse HEAD)
          echo "CURRENT_COMMIT=$CURRENT_COMMIT" >> $GITHUB_ENV
          # 读取上次处理的 commit SHA（如果存在）
          if [ -f bds-output/.brax_processed_commit ]; then
            PREV_COMMIT=$(cat bds-output/.brax_processed_commit)
          else
            PREV_COMMIT=""
          fi
          echo "PREV_COMMIT=$PREV_COMMIT" >> $GITHUB_ENV
          # 比较，设置 should_process
          if [ "$CURRENT_COMMIT" != "$PREV_COMMIT" ]; then
            echo "should_process=true" >> $GITHUB_ENV
            echo "behavior_packs 已更新，需要处理"
          else
            echo "should_process=false" >> $GITHUB_ENV
            echo "behavior_packs 未更新，跳过处理"
          fi

      - name: 克隆 brarchive-extractor
        if: env.should_process == 'true'
        uses: actions/checkout@v4
        with:
          repository: LPaicen/brarchive-extractor
          path: brarchive-extractor
          ref: main

      - name: 构建 brax
        if: env.should_process == 'true'
        run: |
          cd brarchive-extractor
          npm install
          npm run build

      - name: 使用 brax 处理 behavior_packs
        if: env.should_process == 'true'
        run: |
          mkdir -p _out/downloads/processed-behavior_packs
          node brarchive-extractor/dist/src/cli.js bds-output/behavior_packs --schema bds-output/metadata/json_schemas/ --output _out/downloads/processed-behavior_packs --overwrite --verbose

      - name: 打包处理后的 behavior_packs
        if: env.should_process == 'true'
        run: |
          cd _out/downloads
          zip -r processed-behavior_packs.zip processed-behavior_packs

      - name: 更新处理标记并推送回 bds-output-preview
        if: env.should_process == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$CURRENT_COMMIT" > bds-output/.brax_processed_commit
          cd bds-output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/MCxlm1/minecraft-doc.git
          git add .brax_processed_commit
          git commit -m "Update brax processed commit marker"
          git push origin bds-output-preview

      # ---------- 继续原有流程 ----------
      - name: 生成下载页（包含处理后的 behavior_packs）
        run: node scripts/make-downloads.mjs

      - name: 生成 changelog 页面
        run: node scripts/make-changelog-page.mjs

      - name: 部署到 GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_out
          publish_branch: gh-pages
          force_orphan: true
