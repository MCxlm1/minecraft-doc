name: 构建文档站 (typedoc 原生 + MoLang + Legacy)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: '构建模式'
        required: true
        default: 'rebuild'
        options:
          - 'rebuild'               # 仅重新构建网页（用已下载的包 + 现有翻译）
          - 'rebuild-and-update'    # 按 minecraft-versions.json 重新 npm 下载对应版本 + 重建网页

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目依赖 (pnpm 9，typedoc + ts-morph)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --no-frozen-lockfile

      - name: 重新下载 npm 对应版本 (rebuild-and-update)
        if: ${{ github.event.inputs.mode == 'rebuild-and-update' }}
        run: node scripts/npm-update.mjs

      - name: 确保 @minecraft 包存在 (rebuild 兜底)
        if: ${{ github.event.inputs.mode != 'rebuild-and-update' }}
        run: |
          if [ ! -f registry/preview/rc/node_modules/@minecraft/server/index.d.ts ]; then
            echo "未找到已下载的包，执行 npm-update…"
            node scripts/npm-update.mjs
          fi

      - name: 生成 changelog 快照与 diff
        run: node scripts/changelog-generate.mjs

      - name: 生成文档 (typedoc 原生 + 翻译片段 hook，包含主页)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scripts/generate.mjs

      - name: 生成 Legacy 旧版本脚本文档
        run: node scripts/legacy-gen.mjs

      - name: 生成 Molang 文档
        run: node scripts/molang-gen.mjs

      # ---------- 拉取 bds-output-preview 分支的数据 ----------
      - name: 拉取 bds-output-preview 分支
        id: fetch_bds
        run: |
          # 克隆 bds-output-preview 分支到临时目录
          git clone --branch bds-output-preview --depth 1 https://github.com/MCxlm1/minecraft-doc.git bds-output
          # 获取当前 commit SHA（仅用于日志）
          CURRENT_COMMIT=$(cd bds-output && git rev-parse HEAD)
          echo "拉取到 bds-output-preview 分支，commit: $CURRENT_COMMIT"

      - name: 复制处理后的 behavior_packs
        run: |
          # 检查 bds-output 中是否存在 processed-behavior_packs.zip
          if [ -f "bds-output/processed-behavior_packs.zip" ]; then
            mkdir -p _out/downloads
            cp bds-output/processed-behavior_packs.zip _out/downloads/
            echo "已复制 processed-behavior_packs.zip"
          else
            echo "bds-output 中未找到 processed-behavior_packs.zip，跳过"
          fi
          # 清理临时目录
          rm -rf bds-output

      # ---------- 继续原有流程 ----------
      - name: 生成下载页（包含处理后的 behavior_packs）
        run: node scripts/make-downloads.mjs

      - name: 生成 changelog 页面
        run: node scripts/make-changelog-page.mjs

      - name: 部署到 GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_out
          publish_branch: gh-pages
          force_orphan: true
