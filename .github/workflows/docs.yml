name: 构建文档站 (typedoc 原生 + MoLang + Legacy)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: '构建模式'
        required: true
        default: 'rebuild'
        options:
          - 'rebuild'               # 仅重新构建网页（用已下载的包 + 现有翻译）
          - 'rebuild-and-update'    # 按 minecraft-versions.json 重新 npm 下载对应版本 + 重建网页

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目依赖 (pnpm 9，typedoc + ts-morph)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --no-frozen-lockfile

      - name: 重新下载 npm 对应版本 (rebuild-and-update)
        if: ${{ github.event.inputs.mode == 'rebuild-and-update' }}
        run: node scripts/npm-update.mjs

      - name: 确保 @minecraft 包存在 (rebuild 兜底)
        if: ${{ github.event.inputs.mode != 'rebuild-and-update' }}
        run: |
          if [ ! -f registry/preview/rc/node_modules/@minecraft/server/index.d.ts ]; then
            echo "未找到已下载的包，执行 npm-update…"
            node scripts/npm-update.mjs
          fi

      - name: 生成 changelog 快照与 diff
        run: node scripts/changelog-generate.mjs

      - name: 生成文档 (typedoc 原生 + 翻译片段 hook，包含主页)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: node scripts/generate.mjs

      - name: 生成 Legacy 旧版本脚本文档
        run: node scripts/legacy-gen.mjs

      - name: 生成 Molang 文档
        run: node scripts/molang-gen.mjs

      # ---------- 从 GitHub Release 下载处理后的 behavior_packs ----------
      - name: 获取 BDS 版本分支
        id: get_branch
        run: |
          BRANCH=$(node -e "console.log((require('./bds-config.json').branch||'preview').trim())")
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: 从 Release 下载 processed-behavior_packs
        run: |
          TAG="bds-assets-${{ env.BRANCH }}"
          ASSET_NAME="processed-behavior_packs-${{ env.BRANCH }}.zip"
          DOWNLOAD_URL="https://github.com/MCxlm1/minecraft-doc/releases/download/$TAG/$ASSET_NAME"
          mkdir -p _out/downloads
          echo "尝试从 $DOWNLOAD_URL 下载..."
          if curl -L --fail "$DOWNLOAD_URL" -o "_out/downloads/processed-behavior_packs.zip"; then
            echo "成功下载 processed-behavior_packs.zip"
          else
            echo "未找到 processed-behavior_packs.zip，跳过"
          fi

      # ---------- 继续原有流程 ----------
      - name: 生成下载页（包含处理后的 behavior_packs）
        run: node scripts/make-downloads.mjs

      - name: 生成 changelog 页面
        run: node scripts/make-changelog-page.mjs

      - name: 部署到 GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_out
          publish_branch: gh-pages
          force_orphan: true
